<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEO Metadata Crawler</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172026;
      background: #f5f7f8;
    }
    body {
      margin: 0;
    }
    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      margin: 0 0 12px;
      letter-spacing: 0;
    }
    p {
      color: #4c5a63;
      margin: 0;
    }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin: 32px 0 24px;
    }
    input, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid #c9d2d8;
      min-height: 48px;
    }
    input {
      padding: 0 14px;
      background: #fff;
    }
    button {
      border-color: #176b5d;
      background: #176b5d;
      color: #fff;
      padding: 0 18px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .status {
      min-height: 24px;
      color: #6a4b00;
    }
    .result {
      display: none;
      background: #fff;
      border: 1px solid #dce4e8;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    .label {
      color: #66757f;
      font-size: 0.82rem;
      text-transform: uppercase;
    }
    .value {
      margin-top: 4px;
      word-break: break-word;
    }
    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .topic {
      background: #e7f2ef;
      color: #0e554a;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.9rem;
    }
    pre {
      max-height: 380px;
      overflow: auto;
      background: #102027;
      color: #d8f3ec;
      border-radius: 8px;
      padding: 16px;
      white-space: pre-wrap;
    }
    @media (max-width: 640px) {
      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>SEO Metadata Crawler</h1>
    <p>Submit a URL to extract metadata, page type, and local keyword topics.</p>

    <form id="crawl-form">
      <input id="url" name="url" type="url" placeholder="https://example.com/page" required>
      <button id="submit" type="submit">Crawl</button>
    </form>

    <div id="status" class="status"></div>

    <section id="result" class="result" aria-live="polite">
      <h2 id="title"></h2>
      <div class="grid">
        <div>
          <div class="label">Page Type</div>
          <div id="page-type" class="value"></div>
        </div>
        <div>
          <div class="label">Word Count</div>
          <div id="word-count" class="value"></div>
        </div>
        <div>
          <div class="label">Language</div>
          <div id="language" class="value"></div>
        </div>
        <div>
          <div class="label">Canonical</div>
          <div id="canonical" class="value"></div>
        </div>
      </div>
      <div>
        <div class="label">Description</div>
        <p id="description" class="value"></p>
      </div>
      <div style="margin-top: 18px;">
        <div class="label">Topics</div>
        <div id="topics" class="topics"></div>
      </div>
      <h3>Structured JSON</h3>
      <pre id="json"></pre>
    </section>
  </main>

  <script>
    const form = document.getElementById("crawl-form");
    const button = document.getElementById("submit");
    const statusBox = document.getElementById("status");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      statusBox.textContent = "Crawling...";
      result.style.display = "none";

      try {
        const response = await fetch("/api/v1/crawl", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({url: document.getElementById("url").value})
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || data.detail || "Crawl failed");
        }

        document.getElementById("title").textContent = data.title || data.url;
        document.getElementById("page-type").textContent = data.page_type;
        document.getElementById("word-count").textContent = data.word_count;
        document.getElementById("language").textContent = data.language || "unknown";
        document.getElementById("canonical").textContent = data.canonical_url || "none";
        document.getElementById("description").textContent = data.description || "No meta description found.";
        document.getElementById("json").textContent = JSON.stringify(data, null, 2);

        const topics = document.getElementById("topics");
        topics.innerHTML = "";
        data.topics.forEach((topic) => {
          const span = document.createElement("span");
          span.className = "topic";
          span.textContent = topic;
          topics.appendChild(span);
        });

        statusBox.textContent = `Saved crawl #${data.id}`;
        result.style.display = "block";
      } catch (error) {
        statusBox.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
